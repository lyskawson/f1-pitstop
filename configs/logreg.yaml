model: logreg
seed: 42
input: tabular
data:
  samples: data/processed/v1/samples.parquet
  tabular: data/processed/v1/tabular.npz
  sequences: data/processed/v1/sequences.npz
  preprocess: data/processed/v1/preprocess.json
output_dir: runs
parameters:
  C: 1.0
  penalty: l2
  solver: lbfgs
  max_iter: 1000
  fit_intercept: true
  class_weight: null
selection:
  split: val
  metric: average_precision
threshold:
  split: val
  metric: f1
  tie_break: largest
